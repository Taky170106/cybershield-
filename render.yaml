services:
  - type: web
    name: cybershield
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: R_LIBS_USER
        value: /opt/R/library
      - key: RENV_CONFIG_REPOS_OVERRIDE
        value: https://cloud.r-project.org
